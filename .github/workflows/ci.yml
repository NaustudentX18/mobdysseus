name: Android CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.MOBDYSSEUS_KEYSTORE_BASE64 }}
      MOBDYSSEUS_KEYSTORE_PASS: ${{ secrets.MOBDYSSEUS_KEYSTORE_PASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Guard (no symlinks / temp-overlay leftovers)
        run: bash scripts/guard.sh

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobdysseus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Signed release build. Secrets are mapped to job-level env (the only place
      # secrets may be referenced). The step runs only when the keystore secret is set.
      - name: Build signed release APK
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.keystore
          ./gradlew :app:assembleRelease --console=plain

      - name: Upload signed release APK
        if: ${{ env.KEYSTORE_B64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mobdysseus-release-apk
          path: app/build/outputs/apk/release/app-release.apk
