<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A1D26"/>
      <stop offset="70%" stop-color="#0E1015"/>
      <stop offset="100%" stop-color="#060709"/>
    </radialGradient>
    <linearGradient id="neonCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5370"/>
      <stop offset="50%" stop-color="#E06C75"/>
      <stop offset="100%" stop-color="#FF85A0"/>
    </linearGradient>
    <linearGradient id="cyanCore" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="60%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
    <linearGradient id="armorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E3444"/>
      <stop offset="100%" stop-color="#181B24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#neonCoral)" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Outer Cyber Grid Accents -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#252A38" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#E06C75" stroke-width="1" stroke-opacity="0.15"/>
  <path d="M 256 36 L 256 60 M 256 452 L 256 476 M 36 256 L 60 256 M 452 256 L 476 256" stroke="#E06C75" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Outer Geometric Prism / Spartan Odysseus Crest -->
  <path d="M 256 70 L 375 145 L 375 305 L 256 430 L 137 305 L 137 145 Z" 
        fill="url(#armorGrad)" stroke="#3E475C" stroke-width="4"/>

  <!-- Inner Shard Facets -->
  <path d="M 256 70 L 256 256 L 375 145 Z" fill="#3B4357" opacity="0.5"/>
  <path d="M 256 70 L 256 256 L 137 145 Z" fill="#252A37" opacity="0.8"/>
  <path d="M 137 145 L 256 256 L 137 305 Z" fill="#1C202B" opacity="0.9"/>
  <path d="M 375 145 L 256 256 L 375 305 Z" fill="#32394A" opacity="0.6"/>
  <path d="M 137 305 L 256 256 L 256 430 Z" fill="#1E222D" opacity="0.9"/>
  <path d="M 375 305 L 256 256 L 256 430 Z" fill="#282E3D" opacity="0.7"/>

  <!-- Neon Glowing Glyph: Greek Odysseus Lambda/Delta Crest (◢ / Λ) -->
  <path d="M 256 120 L 340 280 L 305 280 L 256 185 L 207 280 L 172 280 Z" 
        fill="url(#neonCoral)" filter="url(#glow)"/>

  <!-- Central Quantum Neural Core (AI Monolith) -->
  <polygon points="256,210 295,256 256,302 217,256" fill="url(#cyanCore)" filter="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="10" fill="#FFFFFF" filter="url(#glow)"/>

  <!-- Dynamic Circuit Traces -->
  <path d="M 217 256 L 155 256 L 137 274" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 295 256 L 357 256 L 375 274" fill="none" stroke="#FF5370" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M 256 302 L 256 380 L 240 396" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Terminal Corner Nodes -->
  <circle cx="155" cy="256" r="4" fill="#00F0FF"/>
  <circle cx="357" cy="256" r="4" fill="#FF5370"/>
  <circle cx="256" cy="380" r="4" fill="#00F0FF"/>
</svg>
